<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的學習歷程 · Quantastro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1430'/%3E%3Cpath d='M16 4l2.6 9.4L28 16l-9.4 2.6L16 28l-2.6-9.4L4 16l9.4-2.6z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../assets/app.css">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.8 8.2L23 12l-8.2 2.8L12 23l-2.8-8.2L1 12l8.2-2.8z"/></svg>Quantastro</a>
  <span class="who" id="who"></span>
</div></header>

<main>
  <div class="wrap narrow" id="loginView" hidden>
    <h1>學生登入</h1>
    <p class="lead">登入後，你玩過的遊戲會記在帳號裡，換電腦或用手機都看得到。</p>
    <form class="card" id="loginForm" novalidate>
      <label class="f"><span>班級代碼</span><input class="i code" id="code" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC234" required><small>老師發的登入卡上的 6 碼</small></label>
      <div class="row">
        <label class="f"><span>座號</span><input class="i num" id="seat" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="12" required></label>
        <label class="f"><span>密碼</span><input class="i num" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 位數字" required></label>
      </div>
      <button class="btn main wide" id="loginBtn">登入</button>
      <p class="msg" id="loginMsg" role="alert"></p>
    </form>
    <p class="small muted" style="margin-top:18px">忘記密碼請找老師重設。不想登入也可以直接<a href="../island/">去好奇島玩</a>，進度只會存在這台裝置。</p>
    <p class="small muted">老師請由 <a href="../teacher/">老師後台</a> 登入。</p>
  </div>

  <div class="wrap" id="teacherView" hidden>
    <h1>你已用老師帳號登入</h1>
    <p class="lead">學習歷程頁是給學生看的。</p>
    <a class="btn main" href="../teacher/">前往老師後台</a>
  </div>

  <div class="wrap" id="meView" hidden>
    <h1 id="meTitle"></h1>
    <p class="lead">這裡是你在 Quantastro 的學習歷程。從好奇島或首頁打開遊戲，就會自動記錄。</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px">
      <a class="btn main" href="../island/">去好奇島</a><button class="btn" id="logoutBtn">登出</button>
    </div>
    <div class="stats" id="stats"></div>
    <section class="card block"><h2>各地區探索進度</h2><div class="zones" id="zones"></div></section>
    <section class="block" style="margin-top:22px">
      <h2>玩過的遊戲</h2>
      <div id="played"></div>
    </section>
    <section class="card block" style="margin-top:22px">
      <details id="todoBox"><summary id="todoSum"></summary><div class="chipset" id="todo" style="margin-top:10px"></div></details>
    </section>
    <p class="msg" id="meMsg" role="alert"></p>
  </div>
</main>
<footer><div class="wrap">共用電腦用完請記得登出。</div></footer>

<script src="../qa.js"></script>
<script src="../data/island-games.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ZONES=window.ISLAND_ZONES||[];
const GAMES={};ZONES.forEach(z=>z.games.forEach(g=>{GAMES[g.url.replace(/^games\/|\.html$/g,'')]={...g,zone:z};}));
const TOTAL=Object.keys(GAMES).length;
const fmt=t=>new Date(t*1000).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const next=new URLSearchParams(location.search).get('next');

function view(v){['loginView','meView','teacherView'].forEach(x=>$(x).hidden=x!==v);}

async function showMe(u){
  view('meView');$('who').textContent=`${u.className} · ${u.seat} 號`;
  $('meTitle').textContent=`${u.className} ${u.seat} 號的學習歷程`;
  let d;try{d=await QA.progress();}catch(e){$('meMsg').textContent=e.message;return;}
  const rows=d.progress.filter(p=>GAMES[p.game]);
  const played=new Set(rows.map(p=>p.game));
  const visits=rows.reduce((n,p)=>n+p.visits,0);
  $('stats').innerHTML=[[`${played.size}<small style="font-size:16px;color:var(--muted)"> / ${TOTAL}</small>`,'玩過的遊戲'],[visits,'總共開啟次數'],[rows[0]?fmt(rows[0].last_at):'—','最近一次']]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  $('zones').innerHTML=ZONES.map(z=>{const n=z.games.filter(g=>played.has(g.url.replace(/^games\/|\.html$/g,''))).length;
    return `<div class="zone" style="--c:${esc(z.color)}"><div class="zh"><b>${esc(z.name)}</b><span class="num">${n} / ${z.games.length}</span></div><div class="bar"><i style="width:${(100*n/z.games.length).toFixed(1)}%"></i></div></div>`;}).join('');
  $('played').innerHTML=rows.length?`<div class="tablebox"><table><thead><tr><th>遊戲</th><th>第一次</th><th>最近一次</th><th>次數</th></tr></thead><tbody>${rows.map(p=>{const g=GAMES[p.game];
    return `<tr><td><span class="dot" style="--c:${esc(g.zone.color)}"></span><a href="../${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a></td><td class="num">${fmt(p.first_at)}</td><td class="num">${fmt(p.last_at)}</td><td class="num">${p.visits}</td></tr>`;}).join('')}</tbody></table></div>`
    :'<div class="empty">還沒有紀錄。去好奇島挑一個遊戲開始吧！</div>';
  const todo=Object.entries(GAMES).filter(([k])=>!played.has(k));
  $('todoSum').textContent=todo.length?`還沒玩過的遊戲（${todo.length} 個）`:'全部的遊戲都玩過了，太厲害了！';
  $('todo').innerHTML=todo.map(([,g])=>`<a class="gchip" style="--c:${esc(g.zone.color)}" href="../${esc(g.url)}" target="_blank" rel="noopener">${esc(g.title)}</a>`).join('');
}

$('code').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');});
['seat','pin'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');}));
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('loginMsg').textContent='';
  const code=$('code').value,seat=$('seat').value,pin=$('pin').value;
  if(code.length!==6||!seat||pin.length!==4){$('loginMsg').textContent='請填班級代碼（6 碼）、座號和 4 位數密碼';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='登入中…';
  try{const u=await QA.loginStudent(code,seat,pin);$('pin').value='';
    if(next==='island'){location.href='../island/';return;}
    await showMe(u);}
  catch(err){$('loginMsg').textContent=err.message;}
  finally{$('loginBtn').disabled=false;$('loginBtn').textContent='登入';}
});
$('logoutBtn').onclick=async()=>{await QA.logout();$('who').textContent='';view('loginView');$('code').focus();};

QA.me().then(u=>{if(!u)view('loginView');else if(u.kind==='teacher'){view('teacherView');$('who').textContent='老師 '+u.username;}else showMe(u);});
</script>
</body>
</html>
