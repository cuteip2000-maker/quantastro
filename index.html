<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quantastro</title>
<meta name="description" content="把看不見的科學，變成玩得到的東西。互動遊戲、影片與教學資源。">
<meta property="og:title" content="Quantastro">
<meta property="og:description" content="把看不見的科學，變成玩得到的東西。互動遊戲、影片與教學資源。">
<meta property="og:url" content="https://quantastro.org/">
<meta name="theme-color" content="#0d1430">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1430'/%3E%3Cpath d='M16 4l2.6 9.4L28 16l-9.4 2.6L16 28l-2.6-9.4L4 16l9.4-2.6z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#0d1430;--panel:#161f44;--panel2:#1e2954;--line:#303c6c;--text:#f6f1e4;--muted:#b4bcd4;--accent:#ffd166;--ink:#16203f;--gut:max(16px,env(safe-area-inset-left),env(safe-area-inset-right));--wide:1180px;--latin:Lexend,"Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:inherit}button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:calc(var(--wide) + 2*var(--gut));margin:auto;padding-inline:var(--gut)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:8px;background:var(--accent);color:var(--ink);padding:6px 12px;border-radius:6px;z-index:9}

.top{position:sticky;top:0;z-index:5;background:rgba(13,20,48,.92);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:8px;font:700 19px/1 var(--latin);letter-spacing:.01em;text-decoration:none}
.brand svg{width:20px;height:20px;fill:var(--accent)}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav a{padding:6px 11px;border-radius:7px;color:var(--muted);font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap}
.acct{flex:none;padding:5px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}.acct:hover{background:var(--panel2)}
.nav a:hover{color:var(--text);background:var(--panel2)}

.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:32px;align-items:center;padding-block:44px 28px}
.eyebrow{margin:0 0 12px;color:var(--accent);font:700 14px/1.4 var(--latin);letter-spacing:.08em}
h1{margin:0;font-size:clamp(31px,4.2vw,54px);line-height:1.2;font-weight:900;letter-spacing:.01em}
.lead{max-width:30em;margin:18px 0 24px;color:var(--muted);font-size:18px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 20px;border-radius:9px;border:1px solid var(--line);font-weight:700;text-decoration:none;cursor:pointer;background:transparent}
.btn:hover{background:var(--panel2)}.btn.main{background:var(--accent);border-color:var(--accent);color:var(--ink)}.btn.main:hover{background:#ffdf8e}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:26px 0 0;padding:0;list-style:none;color:var(--muted);font-size:15px}
.stats b{color:var(--text);font:700 21px/1 var(--latin);margin-right:5px}
.map{position:relative}
.map svg{display:block;width:100%;height:auto;overflow:visible}
.map .ln{stroke-width:1;opacity:.42}.map .zn{font-size:15px;font-weight:700;text-anchor:middle}
.map a{cursor:pointer;outline:none}.map a .hit{fill:transparent}
.map a .st{transition:r .12s}.map a:hover .st,.map a:focus .st{r:7px}
.tip{min-height:48px;margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.5;text-align:center}.tip b{display:block;color:var(--text);font-size:15px}

section{padding-block:30px;scroll-margin-top:60px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin-bottom:16px}
h2{margin:0;font-size:27px;line-height:1.3;font-weight:900}
.head p{margin:0;color:var(--muted);font-size:15px}
.feature{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;text-decoration:none}
.feature+.feature{margin-top:14px}.feature:hover{border-color:var(--accent)}
.fart{min-height:250px;background:#a9e2f0;display:grid;place-items:center;overflow:hidden}.fart svg{width:100%;height:100%;max-height:300px}.fart img{width:100%;height:100%;object-fit:cover;display:block}
.fbody{display:flex;flex-direction:column;justify-content:center;padding:26px clamp(20px,4vw,40px)}
.fbody h3{margin:4px 0 8px;font-size:clamp(25px,3vw,34px);line-height:1.25;font-weight:900}
.fbody p{margin:0 0 16px;color:var(--muted)}.go{color:var(--accent);font-weight:700}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:4px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{color:var(--text);background:var(--panel2)}.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--ink);font-weight:700}
.chip small{margin-left:4px;font:500 12px var(--latin);opacity:.75}
.sub{margin-bottom:14px}.sub .chip{min-height:34px;font-size:14px}.sub .chip[aria-pressed=true]{background:var(--c,var(--text));border-color:var(--c,var(--text))}
.search{flex:1 1 200px;max-width:320px;margin-left:auto}
.search input{width:100%;height:40px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.search input::placeholder{color:#98a2c0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,265px),1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;min-height:150px;padding:15px 16px 13px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:10px;text-align:left;text-decoration:none;cursor:pointer;width:100%}
.card:hover{background:var(--panel2)}
.thumb{margin:-15px -16px 12px;aspect-ratio:16/9;background:radial-gradient(circle at 30% 25%,#34457f,#141c40 70%);overflow:hidden;border-radius:6px 6px 0 0;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:rgba(13,20,48,.82);display:grid;place-items:center}.play svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.kind{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.new{color:var(--ink);background:var(--accent);padding:0 7px;border-radius:4px;font:700 11px/19px var(--latin)}
.card h3{margin:3px 0 4px;font-size:18px;line-height:1.4;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
.empty{padding:38px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.more{display:flex;justify-content:center;margin-top:16px}

footer{margin-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;padding-block:22px calc(22px + env(safe-area-inset-bottom))}
dialog{width:min(960px,calc(100vw - 24px));padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(5,8,22,.86)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 8px 8px 16px}.dh h3{margin:0;font-size:17px;line-height:1.4}
.x{flex:none;width:40px;height:40px;border:0;border-radius:8px;background:transparent;font-size:22px;line-height:1;cursor:pointer}.x:hover{background:var(--panel2)}
.vid{aspect-ratio:16/9;background:#000}.vid iframe{display:block;width:100%;height:100%;border:0}

@media(max-width:860px){
 .hero .wrap{grid-template-columns:minmax(0,1fr);padding-top:30px;gap:14px}.lead{font-size:17px}
 .feature{grid-template-columns:minmax(0,1fr)}.fart{min-height:190px}.fart svg{max-height:220px}
 .search{max-width:none;flex-basis:100%;margin-left:0;order:-1}
}
@media(max-width:560px){.top .wrap{gap:8px;min-height:54px}.brand{font-size:17px}.nav a{padding:6px 7px;font-size:14px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.map a .st{transition:none}}
</style>
</head>
<body>
<a class="skip" href="#library">跳到作品列表</a>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1l2.8 8.2L23 12l-8.2 2.8L12 23l-2.8-8.2L1 12l8.2-2.8z"/></svg>Quantastro</a>
  <nav class="nav" aria-label="內容分類">
    <a href="#game">遊戲</a><a href="#video">影片</a><a href="#resource">教學資源</a><a href="#product">作品</a>
  </nav>
  <a class="acct" id="acct" href="account/">登入</a>
</div></header>

<main>
<div class="hero"><div class="wrap">
  <div>
    <p class="eyebrow">QUANTUM × ASTRO</p>
    <h1>把看不見的科學，<br>變成玩得到的東西。</h1>
    <p class="lead">從量子、星空到數學證明，每個作品都能動手試。先猜猜看，再親眼看結果。</p>
    <div class="cta"><a class="btn main" href="island/" target="_blank" rel="noopener">登上好奇島</a><a class="btn" href="#library">瀏覽全部作品</a></div>
    <ul class="stats" id="stats"></ul>
  </div>
  <div class="map">
    <svg id="sky" viewBox="0 0 560 470" role="group" aria-label="作品星圖：每顆星是一個互動遊戲"></svg>
    <p class="tip" id="tip" aria-live="polite"><b>每顆星都是一個遊戲</b>指向星星看名稱，點一下就出發</p>
  </div>
</div></div>

<section id="featured"><div class="wrap">
  <div class="head"><h2>主打作品</h2></div>
  <div id="features"></div>
</div></section>

<section id="library"><div class="wrap">
  <div class="head"><h2>全部作品</h2><p id="count"></p></div>
  <div class="tools">
    <div class="chips" id="types" role="group" aria-label="依類型篩選"></div>
    <label class="search"><span class="skip">搜尋作品</span><input id="q" type="search" placeholder="搜尋：黑洞、質數、火箭…" autocomplete="off"></label>
  </div>
  <div class="chips sub" id="zones" role="group" aria-label="依主題篩選"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="more"><button class="btn" id="more" hidden>顯示更多</button></div>
</div></section>
</main>

<footer><div class="wrap"><span>© <span id="yr"></span> Quantastro</span><a href="https://github.com/cuteip2000-maker/quantastro" rel="noopener">GitHub</a></div></footer>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h3 id="dt"></h3><button class="x" id="dx" aria-label="關閉影片">×</button></div>
  <div class="vid" id="vid"></div>
</dialog>

<script src="qa.js"></script>
<script src="data/island-games.js"></script>
<script src="data/catalog.js"></script>
<script>
const TYPES=[['all','全部'],['world','互動世界'],['game','遊戲'],['video','影片'],['resource','教學資源'],['product','作品']];
const TYPE_NAME=Object.fromEntries(TYPES),EMPTY={video:'影片正在製作中，很快就會上架。',resource:'學習單與教材正在整理中。',product:'更多作品正在準備中。',world:'新的互動世界正在建造中。'};
const PAGE=24,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe=u=>{u=String(u||'');return /^(https?:\/\/|[\w.-]+\/|[\w.-]+$)/i.test(u)&&!/^(javascript|data):/i.test(u)?u:'#';};
const ytId=v=>/^[\w-]{11}$/.test(v||'')?v:'';
const ZONES=window.ISLAND_ZONES||[];
const ITEMS=[...(window.SITE_ITEMS||[]).filter(i=>i&&TYPE_NAME[i.type]&&i.title),
 ...ZONES.flatMap(z=>z.games.map(g=>({...g,type:'game',topic:z.name,zone:z.id,color:z.color})))];
const ORDER=i=>(i.isNew?0:1);
const state={type:'all',zone:'',q:'',shown:PAGE};

function stats(){const n=t=>ITEMS.filter(i=>i.type===t).length;const a=[[n('game'),'個互動遊戲'],[ZONES.length,'個主題區']];
 if(n('video'))a.push([n('video'),'部影片']);if(n('resource'))a.push([n('resource'),'份教學資源']);
 $('stats').innerHTML=a.map(([v,l])=>`<li><b>${v}</b>${l}</li>`).join('');}

function sky(){let h='',seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
 for(let i=0;i<70;i++)h+=`<circle cx="${(rnd()*560).toFixed(1)}" cy="${(rnd()*470).toFixed(1)}" r="${(.5+rnd()*.8).toFixed(2)}" fill="#fff" opacity="${(.14+rnd()*.3).toFixed(2)}"/>`;
 for(const z of ZONES){const cx=285+z.x*27,cy=240+z.z*36,pts=z.games.map((g,i)=>{const r=11+12.5*Math.sqrt(i+.4),a=i*2.39996+z.x;return[cx+r*Math.cos(a)*1.14,cy+r*Math.sin(a)*.9];});
  h+=`<polyline class="ln" fill="none" stroke="${z.color}" points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`;
  const top=Math.min(...pts.map(p=>p[1]));h+=`<text class="zn" x="${cx.toFixed(1)}" y="${Math.max(16,top-13).toFixed(1)}" fill="${z.color}">${esc(z.name)}</text>`;
  z.games.forEach((g,i)=>{const[x,y]=pts[i];h+=`<a href="${esc(safe(g.url))}" target="_blank" rel="noopener" aria-label="${esc(g.title)}" data-t="${esc(g.title)}" data-d="${esc(g.desc)}"><circle class="hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12"/><circle class="st" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${g.isNew?5.5:3.8}" fill="${g.isNew?'#ffd166':z.color}"/></a>`;});}
 const svg=$('sky');svg.innerHTML=h;const def=$('tip').innerHTML;
 const show=e=>{const a=e.target.closest('a');if(a)$('tip').innerHTML=`<b>${esc(a.dataset.t)}</b>${esc(a.dataset.d)}`;};
 svg.addEventListener('mouseover',show);svg.addEventListener('focusin',show);svg.addEventListener('mouseleave',()=>$('tip').innerHTML=def);svg.addEventListener('focusout',()=>$('tip').innerHTML=def);}

const ISLE=`<svg viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="280" fill="#a9e2f0"/><circle cx="330" cy="54" r="26" fill="#fff4cf"/><ellipse cx="200" cy="205" rx="186" ry="58" fill="#7fd0e3"/><path d="M52 196c16-44 76-62 148-62s136 20 150 62c-24 30-82 42-150 42S74 226 52 196z" fill="#f6dfae"/><path d="M78 186c16-34 66-50 122-50s108 16 122 50c-24 20-70 30-122 30s-100-10-122-30z" fill="#9bd77c"/><path d="M178 148l24-58 26 58z" fill="#c9b8ff"/><circle cx="203" cy="88" r="9" fill="#fff"/><path d="M286 172v-54l15 22v32z" fill="#fff"/><path d="M286 118l-11 20h22z" fill="#ff8fab"/><circle cx="118" cy="164" r="19" fill="#62b868"/><circle cx="142" cy="172" r="14" fill="#74c776"/><path d="M118 178h6v18h-6z" fill="#9a6a44"/><circle cx="232" cy="186" r="11" fill="#ffe08a"/><circle cx="256" cy="194" r="7" fill="#ffb4c8"/><path d="M160 208a22 16 0 0 1 44 0z" fill="#5d7fa8"/></svg>`;

function features(){const f=ITEMS.filter(i=>i.featured);$('featured').hidden=!f.length;
 $('features').innerHTML=f.map(i=>{const v=ytId(i.youtube),art=i.image?`<img src="${esc(safe(i.image))}" alt="" loading="lazy">`:v?`<img src="https://i.ytimg.com/vi/${v}/hqdefault.jpg" alt="" loading="lazy" onload="if(this.naturalWidth<=120)this.remove()">`:ISLE;
  const body=`<div class="fart">${art}</div><div class="fbody"><span class="kind">${esc(TYPE_NAME[i.type])}</span><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p><span class="go">${v?'播放影片':'開始探索'} →</span></div>`;
  return v?`<button class="feature" style="width:100%;padding:0;text-align:left;cursor:pointer" data-v="${v}" data-t="${esc(i.title)}">${body}</button>`:`<a class="feature" href="${esc(safe(i.url))}" target="_blank" rel="noopener">${body}</a>`;}).join('');}

function match(i){if(state.type!=='all'&&i.type!==state.type)return false;if(state.zone&&i.zone!==state.zone)return false;
 const q=state.q.trim().toLowerCase();return !q||[i.title,i.desc,i.topic].join(' ').toLowerCase().includes(q);}

function card(i){const v=ytId(i.youtube),style=i.color?` style="--c:${esc(i.color)}"`:'',thumb=v?`<div class="thumb"><img src="https://i.ytimg.com/vi/${v}/hqdefault.jpg" alt="" loading="lazy" onload="if(this.naturalWidth<=120)this.remove()"><span class="play"><svg viewBox="0 0 16 16"><path d="M2 1l13 7-13 7z"/></svg></span></div>`:i.image?`<div class="thumb"><img src="${esc(safe(i.image))}" alt="" loading="lazy"></div>`:'';
 const inner=`${thumb}<span class="kind"><span>${esc(i.topic||TYPE_NAME[i.type])}</span>${i.isNew?'<span class="new">NEW</span>':''}</span><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p>`;
 return v?`<button class="card"${style} data-v="${v}" data-t="${esc(i.title)}">${inner}</button>`:`<a class="card"${style} href="${esc(safe(i.url))}" target="_blank" rel="noopener">${inner}</a>`;}

function render(){
 $('types').innerHTML=TYPES.map(([k,l])=>{const n=k==='all'?ITEMS.length:ITEMS.filter(i=>i.type===k).length;return `<button class="chip" data-type="${k}" aria-pressed="${state.type===k}">${l}<small>${n}</small></button>`;}).join('');
 const showZ=state.type==='game';$('zones').hidden=!showZ;
 if(showZ)$('zones').innerHTML=`<button class="chip" data-zone="" aria-pressed="${!state.zone}">全部主題</button>`+ZONES.map(z=>`<button class="chip" style="--c:${esc(z.color)}" data-zone="${z.id}" aria-pressed="${state.zone===z.id}">${esc(z.name)}</button>`).join('');
 const list=ITEMS.filter(match).map((x,n)=>[x,n]).sort((a,b)=>ORDER(a[0])-ORDER(b[0])||a[1]-b[1]).map(a=>a[0]);
 $('grid').innerHTML=list.slice(0,state.shown).map(card).join('');
 $('count').textContent=`共 ${list.length} 項`;$('more').hidden=list.length<=state.shown;$('more').textContent=`顯示更多（還有 ${Math.max(0,list.length-state.shown)} 項）`;
 $('empty').hidden=list.length>0;if(!list.length)$('empty').textContent=state.q?`找不到「${state.q}」，換個關鍵字試試。`:(EMPTY[state.type]||'這裡還沒有內容。');
}
function setType(t,scroll){state.type=TYPE_NAME[t]?t:'all';state.zone='';state.shown=PAGE;render();if(scroll)$('library').scrollIntoView();}

function openVideo(id,title){$('dt').textContent=title;$('vid').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(title)}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;$('dlg').showModal();}
const closeVideo=()=>{$('vid').innerHTML='';if($('dlg').open)$('dlg').close();};$('dx').onclick=closeVideo;$('dlg').addEventListener('close',()=>$('vid').innerHTML='');$('dlg').addEventListener('cancel',()=>$('vid').innerHTML='');
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeVideo();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)openVideo(b.dataset.v,b.dataset.t);});
$('types').addEventListener('click',e=>{const b=e.target.closest('[data-type]');if(b){history.replaceState(null,'',b.dataset.type==='all'?location.pathname:'#'+b.dataset.type);setType(b.dataset.type);}});
$('zones').addEventListener('click',e=>{const b=e.target.closest('[data-zone]');if(b){state.zone=b.dataset.zone;state.shown=PAGE;render();}});
$('q').addEventListener('input',e=>{state.q=e.target.value;state.shown=PAGE;render();});
$('more').onclick=()=>{state.shown+=PAGE;render();};
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TYPE_NAME[t])setType(t,true);});
$('yr').textContent=new Date().getFullYear();
QA.me().then(u=>{if(!u)return;const a=$('acct');if(u.kind==='teacher'){a.textContent='老師後台';a.href='teacher/';}else{a.textContent=`${u.className} · ${u.seat} 號`;a.href='account/';}});
stats();sky();features();const h0=location.hash.slice(1);if(TYPE_NAME[h0])setType(h0,true);else render();
</script>
